name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/mindshift-3d-framer-site-pwaqy1
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: true
      # the github-pages environment blocks artifact deploys from this branch,
      # so serve via branch build: ensure legacy build mode and request a build
      - name: Ensure branch-based Pages build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}' \
            -o /tmp/put.json -w 'PUT /pages -> %{http_code}\n' || true
          cat /tmp/put.json || true
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds \
            -o /tmp/build.json -w 'POST /pages/builds -> %{http_code}\n' || true
          cat /tmp/build.json || true
